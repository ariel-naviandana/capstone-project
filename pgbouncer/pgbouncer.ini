[databases]
capstone      = host=postgres-primary port=5432 dbname=capstone
capstone_read = host=postgres-replica  port=5432 dbname=capstone

[pgbouncer]
pool_mode            = transaction
max_client_conn      = 10000
default_pool_size    = 20
min_pool_size        = 5
reserve_pool_size    = 5
reserve_pool_timeout = 3
server_reset_query   = DEALLOCATE ALL
listen_port          = 6432
listen_addr          = *
auth_type            = plain
auth_file            = /tmp/userlist.txt
admin_users          = postgres
stats_users          = postgres
ignore_startup_parameters = extra_float_digits,search_path,application_name,TimeZone
