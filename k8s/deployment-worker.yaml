apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankx-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bankx-worker
  template:
    metadata:
      labels:
        app: bankx-worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: worker
        image: capstone-project-worker:latest
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: bankx-config
        - secretRef:
            name: bankx-secret
        resources:
          requests:
            cpu: "100m"
            memory: "150Mi"
          limits:
            cpu: "500m"
            memory: "300Mi"

        # Worker tidak punya HTTP server — gunakan exec probe.
        # stat /proc/1/exe gagal jika PID 1 (main goroutine) sudah exit/crash.
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "stat /proc/1/exe > /dev/null 2>&1"]
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
