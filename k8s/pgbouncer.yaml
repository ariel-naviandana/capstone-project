# Secret: userlist.txt credentials untuk PgBouncer plain auth
apiVersion: v1
kind: Secret
metadata:
  name: pgbouncer-userlist
type: Opaque
stringData:
  userlist.txt: |
    "postgres" "capstone123"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  labels:
    app: pgbouncer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
      - name: pgbouncer
        image: pgbouncer/pgbouncer:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 6432
        env:
        # Minikube: hanya 1 postgres (bukan replika).
        # Kedua logical DB (capstone & capstone_read) route ke postgres:5432.
        - name: DATABASES
          value: "capstone = host=postgres.default.svc.cluster.local port=5432 dbname=capstone,capstone_read = host=postgres.default.svc.cluster.local port=5432 dbname=capstone"
        - name: PGBOUNCER_AUTH_TYPE
          value: "plain"
        - name: PGBOUNCER_AUTH_FILE
          value: "/etc/pgbouncer/userlist.txt"
        - name: PGBOUNCER_LISTEN_PORT
          value: "6432"
        - name: PGBOUNCER_POOL_MODE
          value: "transaction"
        # Dikurangi ke 1000 dari 10000 (Minikube ulimit constraint)
        - name: PGBOUNCER_MAX_CLIENT_CONN
          value: "1000"
        - name: PGBOUNCER_DEFAULT_POOL_SIZE
          value: "20"
        - name: PGBOUNCER_MIN_POOL_SIZE
          value: "5"
        - name: PGBOUNCER_RESERVE_POOL_SIZE
          value: "5"
        - name: PGBOUNCER_RESERVE_POOL_TIMEOUT
          value: "3"
        - name: PGBOUNCER_SERVER_RESET_QUERY
          value: "DEALLOCATE ALL"
        - name: PGBOUNCER_IGNORE_STARTUP_PARAMETERS
          value: "extra_float_digits,search_path,application_name,TimeZone"
        - name: PGBOUNCER_ADMIN_USERS
          value: "postgres"
        - name: PGBOUNCER_STATS_USERS
          value: "postgres"
        volumeMounts:
        - name: userlist
          mountPath: /etc/pgbouncer/userlist.txt
          subPath: userlist.txt
          readOnly: true
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        readinessProbe:
          tcpSocket:
            port: 6432
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 6432
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: userlist
        secret:
          secretName: pgbouncer-userlist

---
# ClusterIP Service — referenced by app as "pgbouncer:6432"
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
spec:
  type: ClusterIP
  selector:
    app: pgbouncer
  ports:
  - name: pgbouncer
    port: 6432
    targetPort: 6432
