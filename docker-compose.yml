# =============================================================================
# Total resource budget across all services (sum of `deploy.resources.limits`):
#
#   Service             CPU     Memory
#   ------------------  ------  --------
#   api                  2.0     512 MB
#   worker               1.0     384 MB
#   postgres-primary     2.0    1024 MB
#   postgres-replica     1.5     768 MB
#   redis                0.5     256 MB
#   mongo                0.2     350 MB
#   zookeeper            0.2     256 MB
#   kafka                1.5     768 MB
#   prometheus           0.1     128 MB
#   grafana              0.1     128 MB
#   ------------------  ------  --------
#   TOTAL                9.1    ~4.5 GB
#
# Plan for at least 10 logical CPU cores and 6 GB RAM available to Docker
# (limits are caps, not reservations — but on a saturated host you want
# headroom for the kernel, the Docker daemon, and bursty containers).
# On Docker Desktop (Windows/macOS), set Resources -> CPUs >= 10, Memory >= 6 GB.
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: tx-api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - app-network
    # Resource limits raised for k6 load testing. Original: 0.7 CPU / 150M.
    # The API is the hot path — under thousands of TPS with 0.7 CPU it
    # spends most of its time waiting for the scheduler. Tune down if your
    # host has less headroom (Docker Desktop on Windows / WSL2 honors these).
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: tx-worker
    restart: always
    depends_on:
      postgres-primary:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - app-network
    # Worker bumped from 0.5/150M for parallel Kafka batch processing.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M

  postgres-primary:
    image: postgres:18
    container_name: tx-postgres-primary
    restart: always
    command:
      [
        "postgres",
        "-c",
        "max_connections=200",
        "-c",
        "shared_buffers=64MB",
        "-c",
        "synchronous_commit=off",
        "-c",
        "wal_buffers=16MB",
        "-c",
        "checkpoint_timeout=15min",
      ]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-capstone}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capstone123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./docker/postgres/init-primary.sh:/docker-entrypoint-initdb.d/02_init-primary.sh
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-capstone}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network
    # Postgres primary bumped from 0.9/256M. Writes from the worker + reads
    # that miss the cache all funnel here, so it's the second-tier bottleneck.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  postgres-replica:
    image: postgres:18
    container_name: tx-postgres-replica
    restart: always
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      - PGDATA=/var/lib/postgresql/18/main
      - POSTGRES_DB=${POSTGRES_DB:-capstone}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-capstone123}
    command: >
      bash -e -c "
        echo 'Starting replica sync...';
        until pg_isready -h postgres-primary -U ${POSTGRES_USER:-postgres}; do
          sleep 2;
        done;
        if [ -z \"\$(ls -A $$PGDATA)\" ]; then
          echo 'Data directory is empty, starting pg_basebackup...';
          export PGPASSWORD=reppassword;
          pg_basebackup -h postgres-primary -D $$PGDATA -U repuser -vP -w -R;
          chown postgres:postgres -R /var/lib/postgresql/18;
        fi;
        echo 'Starting PostgreSQL...';
        exec docker-entrypoint.sh postgres -c max_connections=200 -c shared_buffers=64MB
      "
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-capstone}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - app-network
    # Replica bumped from 0.5/256M. Serves all GET-balance / GET-tx reads.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M

  redis:
    image: redis:7
    container_name: tx-redis
    restart: always
    # maxmemory raised so balance/tx caches actually have room to live.
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network
    # Redis bumped from 0.1/50M. Every request hits it (rate-limit + cache),
    # and 0.1 CPU was the silent killer of p95 latency under load.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  mongo:
    image: mongo:7
    container_name: tx-mongo
    restart: always
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-capstone123}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 350M

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: tx-zookeeper
    restart: always
    ports:
      - "2181:2181"
    environment:
      KAFKA_HEAP_OPTS: "-Xmx128M -Xms128M"
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_datalog:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "zookeeper-shell", "localhost:2181", "ls", "/"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: tx-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:9092",
          "--list",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - app-network
    # Kafka bumped from 0.7/512M. Sits on the POST hot path via async producer.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 128M
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=capstone
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  postgres_primary_data:
  postgres_replica_data:
  redis_data:
  mongo_data:
  zookeeper_data:
  zookeeper_datalog:
  kafka_data:
  prometheus_data:
  grafana_data:
